[tool.ruff]
line-length = 120
target-version = "py314"  # matches the Docker image, CI and the local venv

[tool.ruff.lint]
# E/F: pyflakes + real errors. I: import order. B: bugbear.
# DTZ: naive datetimes — the container runs in UTC, and naive
# date.today()/datetime.now() have already caused one real bug here.
# S: flake8-bandit — shell/subprocess use, unsafe deserialisation, weak
# hashes, hardcoded secrets. The kiosk routes are PIN-free by design, so
# an injection anywhere would be reachable from any device on the LAN.
select = ["E4", "E7", "E9", "F", "I", "B", "DTZ", "S"]
ignore = [
    "B008",  # FastAPI's Form(...)/Query(...)/Depends(...) defaults are the intended pattern
    # Every f-string SQL here splices module constants (avatars.COLUMNS, a
    # WHERE fragment) or a "?, ?, ?" placeholder list; values are always
    # bound. Reviewed 30 Sep 2026; keep it that way in new code.
    "S608",
]

[tool.ruff.lint.per-file-ignores]
# S101: pytest is built on assert. S105/S106: fake PINs and tokens.
# S311: random test data. S603: the e2e harness starts uvicorn.
"tests/*" = ["DTZ", "S101", "S105", "S106", "S311", "S603"]
"app/google_oauth.py" = ["S105"]  # TOKEN_ENDPOINT is a URL, not a secret
"app/google_photos.py" = ["S105"]
"app/main.py" = ["E402"]  # load_dotenv() must run before the app imports read env vars
"tests/conftest.py" = ["E402"]  # env vars must be set before importing app modules

# Type checking, introduced gradually (spec 9.8). CI's `typecheck` job runs
# plain `mypy`, which reads `files` below. mypy's defaults are the lenient
# "basic" level: only annotated functions have their bodies checked, so
# un-annotated code is left alone until someone adds hints. app/ started clean
# (a handful of trivial fixes, no baseline file), so any new error fails CI.
# Tighten in steps: add tests/ to `files`, then turn on check_untyped_defs.
[tool.mypy]
files = ["app"]
python_version = "3.14"
warn_unused_ignores = true
warn_redundant_casts = true
disable_error_code = ["annotation-unchecked"]  # just the "bodies aren't checked" reminder

[[tool.mypy.overrides]]
module = ["apscheduler.*"]  # ships no type information
ignore_missing_imports = true
