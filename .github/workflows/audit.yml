name: Dependency audit

# pip-audit checks every pinned package against the Python advisory
# database. It runs on each PR and push (about a minute, so it can be a
# required check) and weekly on a schedule, since an advisory can appear
# without any commit; a scheduled failure emails the repository owner.
# Dependabot's security updates open the PR that fixes it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC, after Dependabot's weekly run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      # --no-deps: the lock files are fully pinned, so audit exactly what they
      # say rather than resolving again. (pip-audit then prints a generic
      # "consider hashing" warning; the files are hashed, ignore it.) The
      # runtime set first, since that is what the image ships; the dev set
      # covers the tools CI itself runs.
      - name: Runtime dependencies
        run: pip-audit --no-deps -r requirements.txt
      - name: Dev and CI dependencies
        run: pip-audit --no-deps -r requirements-dev.txt
