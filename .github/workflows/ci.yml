name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch or PR cancels the run it supersedes, so a
# quick fix-up commit doesn't queue behind a run whose result nobody needs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"  # same as the Docker image
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests  # formatting is enforced, not reviewed
      # Coverage is reported, not gated: the per-file table goes to the job
      # summary and coverage.xml is kept as an artifact. To gate later, add
      # --cov-fail-under=<a point or two under the observed number>.
      - run: python -m pytest -q --cov=app --cov-report=xml --cov-report=term-missing:skip-covered
      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage (app/)" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown --skip-covered --sort=cover >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  # A rebase once left a conflict marker in style.css that no test noticed.
  # Nothing tracked (vendored files included) legitimately has one.
  conflict-markers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: |
          if git grep -nE '^(<<<<<<< |=======[[:space:]]*$|>>>>>>> )'; then
            echo "::error::Git conflict markers left in the files above"; exit 1
          fi

  # Checks that need no Python. The hand-written JS modules have no build
  # step or linter, so at least make sure each one parses; and the vendored
  # libraries must be byte-for-byte the files app/static/vendor/README.md
  # records (an accidental edit to a minified file is invisible in review).
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: JavaScript syntax
        run: |
          for f in app/static/js/*.js; do node --check "$f"; done
      - name: Vendored libraries match SHA256SUMS
        working-directory: app/static/vendor
        run: |
          sha256sum --check --strict SHA256SUMS
          # Every vendored file must be listed, not just the ones that are.
          find . -type f ! -name SHA256SUMS ! -name README.md ! -name 'LICENSE*' ! -name '*.LICENSE.txt' \
            | sed 's|^\./||' | sort > /tmp/present
          awk '{print $2}' SHA256SUMS | sort > /tmp/listed
          diff /tmp/listed /tmp/present \
            || { echo "::error::app/static/vendor has files not in SHA256SUMS (or listed files missing)"; exit 1; }

  # requirements*.txt must be what `uv pip compile` makes from the .in files.
  # uv keeps the versions already pinned in the .txt, so this only fails when
  # someone edited a .in (or a .txt by hand) without recompiling.
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install uv==0.12.19
      - run: |
          uv pip compile requirements.in --universal --python-version 3.14 --generate-hashes -o requirements.txt -q
          uv pip compile requirements-dev.in --universal --python-version 3.14 --generate-hashes -o requirements-dev.txt -q
          git diff --exit-code -- requirements.txt requirements-dev.txt \
            || { echo "::error::Lock files are stale: recompile them (see README, Dependencies)"; exit 1; }

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: mypy  # files and settings: [tool.mypy] in pyproject.toml

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m e2e -q
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: test-results/e2e/
          if-no-files-found: ignore

  # Build the production image, then actually start it: a runtime-only fault
  # (permissions on /data, a missing system library, a migration that only
  # fails on a fresh database) passes `docker build` but not this.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t huddle-ci .
      - name: Start the image and wait for /health
        run: |
          # A named volume, not a bind mount: Docker seeds it from the image's
          # /data, so it is owned by the container's non-root user.
          docker run -d --name huddle -p 8000:8000 -v huddle-ci-data:/data huddle-ci
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              echo "/health answered 200 after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::/health never answered 200"
          docker logs huddle
          exit 1
      - name: Container log is clean
        run: |
          docker logs huddle > container.log 2>&1
          cat container.log
          if grep -nE 'MigrationError|Traceback|ERROR' container.log; then
            echo "::error::The container logged an error while starting"; exit 1
          fi
