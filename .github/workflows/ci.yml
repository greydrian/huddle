name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # same as the Docker image
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check app tests
      - run: python -m pytest -q

  # requirements*.txt must be what `uv pip compile` makes from the .in files.
  # uv keeps the versions already pinned in the .txt, so this only fails when
  # someone edited a .in (or a .txt by hand) without recompiling.
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install uv==0.12.19
      - run: |
          uv pip compile requirements.in --universal --python-version 3.14 --generate-hashes -o requirements.txt -q
          uv pip compile requirements-dev.in --universal --python-version 3.14 --generate-hashes -o requirements-dev.txt -q
          git diff --exit-code -- requirements.txt requirements-dev.txt \
            || { echo "::error::Lock files are stale: recompile them (see README, Dependencies)"; exit 1; }

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: mypy  # files and settings: [tool.mypy] in pyproject.toml

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m e2e -q
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: test-results/e2e/
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t huddle-ci .
