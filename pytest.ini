[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    e2e: browser smoke tests (tests/e2e): real uvicorn + Playwright Chromium
# The browser tests are slow-ish, so the plain run skips them; `pytest -m e2e`
# runs just them (a later -m on the command line wins).
addopts = -m "not e2e"
