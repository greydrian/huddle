services:
  family-display:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Bind mount, per spec 9.7 — plain host folder, browsable/backupable/
      # rsync'able directly. Safe for SQLite's WAL mode here because the
      # deployment target (GMKtec G10) runs native Linux; the gRPC-FUSE/
      # virtiofs file-locking caveat that would make a bind mount risky is
      # specific to Docker Desktop on Windows/Mac and doesn't apply on the
      # actual server.
      - ./data/family-display:/data
    restart: unless-stopped
