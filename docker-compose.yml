services:
  family-display:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Read from a .env file at the project root (Compose loads this
      # automatically for variable substitution — copy .env.example to
      # .env and fill in real values; it's gitignored). Blank is fine —
      # the app just shows "not configured" in Admin until these are set.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Photos account for the idle slideshow (optional, a second OAuth client).
      GOOGLE_PHOTOS_CLIENT_ID: ${GOOGLE_PHOTOS_CLIENT_ID:-}
      GOOGLE_PHOTOS_CLIENT_SECRET: ${GOOGLE_PHOTOS_CLIENT_SECRET:-}
      # School inbox (optional): blank = Admin shows "not set up".
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    volumes:
      # Bind mount, per spec 9.7 — plain host folder, browsable/backupable/
      # rsync'able directly. Safe for SQLite's WAL mode here because the
      # deployment target (GMKtec G10) runs native Linux; the gRPC-FUSE/
      # virtiofs file-locking caveat that would make a bind mount risky is
      # specific to Docker Desktop on Windows/Mac and doesn't apply on the
      # actual server.
      - ./data/family-display:/data
    restart: unless-stopped
    # Spec 10.12: cap the container log so a chatty outage can't fill the
    # G10's disk. About 30 MB in all; `docker compose logs` still works.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
