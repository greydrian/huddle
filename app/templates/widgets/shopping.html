{% from "_icons.html" import icon, widget_header %}
<div class="widget-card" id="widget-shopping">
  {{ widget_header("shopping-basket", "Shopping List") }}
  <div class="widget-body">
    {% for item in items %}
    <div class="shopping-row {{ 'checked' if item.is_checked else '' }}">
      <button class="shopping-check" aria-label="{{ 'Untick' if item.is_checked else 'Tick' }} {{ item.title }}"
              hx-post="/api/shopping/{{ item.id }}/toggle"
              hx-target="#widget-shopping" hx-swap="outerHTML">{{ icon("check", 18) }}</button>
      <span class="shopping-title">{{ item.title }}</span>
      <button class="shopping-delete" aria-label="Remove {{ item.title }}"
              hx-post="/api/shopping/{{ item.id }}/delete"
              hx-target="#widget-shopping" hx-swap="outerHTML">{{ icon("x", 20) }}</button>
    </div>
    {% else %}
    <div class="widget-note">List's empty — add something below.</div>
    {% endfor %}
    <form class="shopping-add-form"
          hx-post="/api/shopping" hx-target="#widget-shopping" hx-swap="outerHTML">
      <input type="text" name="title" aria-label="New item" placeholder="Add an item…" required autocomplete="off"{% if onscreen_keyboard %} data-osk="text"{% endif %}>
      <button type="submit">Add</button>
    </form>
  </div>
</div>
