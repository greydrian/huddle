<div class="widget-card" id="widget-tasks">
  <div class="widget-pin"></div>
  <div class="widget-tab" style="background: var(--system-accent);">
    <svg width="13" height="13" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7.5,11 L10,13.5 L16,6.5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Chores
  </div>
  <div class="widget-header">
    <svg width="18" height="18" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.5,11 L10,13.5 L16,6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Today's Tasks
  </div>
  <div class="widget-body">
    {% for profile in profiles %}
    <div class="task-group">
      <div class="task-group-name" style="color: {{ profile.colour_hex }};">
        <span class="task-group-dot" style="background: {{ profile.colour_hex }};"></span>
        {{ profile.name }}
      </div>
      {% for task in profile.tasks %}
      <div class="task-row {{ 'completed' if task.is_completed else '' }}">
        <button class="task-check"
                hx-post="/api/tasks/{{ task.id }}/toggle"
                hx-target="#widget-tasks"
                hx-swap="outerHTML">✓</button>
        <span class="task-title">{{ task.title }}</span>
      </div>
      {% else %}
      <div class="stub-widget" style="padding: 4px 0; font-size: 0.8rem;">No tasks yet — add some in Admin.</div>
      {% endfor %}
    </div>
    {% endfor %}
  </div>
</div>
