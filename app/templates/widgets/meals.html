{% from "_icons.html" import icon %}
<div class="widget-card" id="widget-meals">
  <div class="widget-header drag-handle">
    {{ icon("utensils", 22, "widget-icon") }}
    <h2 class="widget-title">Meal Plan</h2>
  </div>
  <div class="widget-body">
    {% for day in days %}
    <div class="meal-row {{ 'today' if day.is_today else '' }}">
      <span class="meal-weekday">{{ day.weekday[:3] }}</span>
      <input class="meal-desc-input" type="text" name="description" aria-label="{{ day.weekday }} meal"
             value="{{ day.description }}" placeholder="Not planned" autocomplete="off"{% if onscreen_keyboard %} data-osk="text"{% endif %}
             hx-post="/api/meals/{{ day.date }}" hx-trigger="change"
             hx-target="#widget-meals" hx-swap="outerHTML">
    </div>
    {% endfor %}
  </div>
</div>
